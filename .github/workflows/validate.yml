name: Validate EV Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check live.js
          node --check insurance.js
          node --check partners.js
          node --check feedback.js
          node --check resilience.js
          node --check brand.js
          node --check brand-light.js
          node --check worker.js
          node --check worker-admin.js
          node --check worker-entry.js
          node --check admin-api.js
          node --check account-api.js
          node --check account-schema.js
          node --check account.js
          node --check account-personalisation.js
          node --check account-polish.js
          node --check autotrader.js
          node --check seo-guides.js
          node --check seo-models.js
          node --check seo-intent.js
          node --check home-seo.js
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f live.js
          test -f insurance.js
          test -f partners.js
          test -f feedback.js
          test -f resilience.js
          test -f brand.js
          test -f brand-light.js
          test -f worker.js
          test -f worker-admin.js
          test -f worker-entry.js
          test -f admin-api.js
          test -f account-api.js
          test -f account-schema.js
          test -f account.js
          test -f account-personalisation.js
          test -f account-polish.js
          test -f account.css
          test -f account-polish.css
          test -f migrations/0001_accounts.sql
          test -f autotrader.js
          test -f seo-guides.js
          test -f seo-models.js
          test -f seo-intent.js
          test -f home-seo.js
          test -f seo.css
          test -f seo-models.css
          test -f seo-intent.css
          test -f wrangler.jsonc
          test -f .assetsignore
          test -f privacy.html
          test -f cookies.html
          test -f terms.html
          test -f affiliate-disclosure.html
          test -f legal.css
      - name: Validate legal page links
        run: |
          grep -q '/privacy.html' resilience.js
          grep -q '/cookies.html' resilience.js
          grep -q '/terms.html' resilience.js
          grep -q '/affiliate-disclosure.html' resilience.js
      - name: Validate SEO routes and crawler files
        run: |
          grep -q '/ev-guides' worker.js
          grep -q '/cars' worker.js
          grep -q '/compare/' worker.js
          grep -q '/best/' worker.js
          grep -q '/robots.txt' worker.js
          grep -q '/sitemap.xml' worker.js
          grep -q 'OAI-SearchBot' seo-guides.js
          grep -q 'FAQPage' home-seo.js
          grep -q 'tesla/model-3' seo-models.js
          grep -q 'nissan/leaf' seo-models.js
          grep -q 'hyundai-ioniq-5-vs-kia-ev6' seo-intent.js
          grep -q 'first-used-electric-car' seo-intent.js
      - name: Validate account layer
        run: |
          grep -q 'handleAccountRequest' worker-entry.js
          grep -q 'ensureAccountSchema' worker-entry.js
          grep -q 'EVSCAN_DB' worker-entry.js
          grep -q 'account-personalisation.js' worker-entry.js
          grep -q 'account-polish.js' worker-entry.js
          grep -q 'account-polish.css' worker-entry.js
          grep -q 'PBKDF2' account-api.js
          grep -q 'HttpOnly; Secure; SameSite=Lax' account-api.js
          grep -q 'saved_scans' migrations/0001_accounts.sql
          grep -q 'garage_vehicles' migrations/0001_accounts.sql
          grep -q 'Download my data' account.js
          grep -q 'Delete my account' account.js
          grep -q 'getDrivingProfile' account-personalisation.js
          grep -q 'See what you get' account-polish.js
          grep -q 'Create free account' account-polish.js
          grep -q 'data-scroll-home' account-polish.js
      - name: Validate Wrangler JSONC basics
        run: |
          grep -q '"main": "./worker-entry.js"' wrangler.jsonc
          grep -q '"d1_databases"' wrangler.jsonc
          grep -q '"binding": "EVSCAN_DB"' wrangler.jsonc
          grep -q '"database_name": "ec-scan-db"' wrangler.jsonc
          grep -q '"database_id": "2f90d7be-db18-47eb-983e-3ce9095921e9"' wrangler.jsonc
          grep -q '"/api/\*"' wrangler.jsonc
          grep -q '"/cars/\*"' wrangler.jsonc
          grep -q '"/compare/\*"' wrangler.jsonc
          grep -q '"/best/\*"' wrangler.jsonc
