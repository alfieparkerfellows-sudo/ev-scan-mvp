name: Validate EV Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check live.js
          node --check listing-live.js
          node --check insurance.js
          node --check partners.js
          node --check feedback.js
          node --check resilience.js
          node --check brand.js
          node --check brand-light.js
          node --check worker.js
          node --check worker-admin.js
          node --check worker-providers.js
          node --check worker-entry.js
          node --check listing-providers.js
          node --check admin-api.js
          node --check account-api.js
          node --check account-schema.js
          node --check account.js
          node --check account-personalisation.js
          node --check account-polish.js
          node --check finder-v2.js
          node --check autotrader.js
          node --check seo-guides.js
          node --check seo-models.js
          node --check seo-intent.js
          node --check home-seo.js
          node --check tests/listing-live.test.cjs
      - name: Test listing scan request lifecycle
        run: node tests/listing-live.test.cjs
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f live.js
          test -f listing-live.js
          test -f insurance.js
          test -f partners.js
          test -f feedback.js
          test -f resilience.js
          test -f brand.js
          test -f brand-light.js
          test -f worker.js
          test -f worker-admin.js
          test -f worker-providers.js
          test -f worker-entry.js
          test -f listing-providers.js
          test -f admin-api.js
          test -f account-api.js
          test -f account-schema.js
          test -f account.js
          test -f account-personalisation.js
          test -f account-polish.js
          test -f account.css
          test -f account-polish.css
          test -f finder-v2.js
          test -f finder-v2.css
          test -f migrations/0001_accounts.sql
          test -f autotrader.js
          test -f seo-guides.js
          test -f seo-models.js
          test -f seo-intent.js
          test -f home-seo.js
          test -f seo.css
          test -f seo-models.css
          test -f seo-intent.css
          test -f wrangler.jsonc
          test -f .assetsignore
          test -f docs/LISTING_PROVIDER_STACK.md
          test -f privacy.html
          test -f cookies.html
          test -f terms.html
          test -f affiliate-disclosure.html
          test -f legal.css
      - name: Validate legal page links
        run: |
          grep -q '/privacy.html' resilience.js
          grep -q '/cookies.html' resilience.js
          grep -q '/terms.html' resilience.js
          grep -q '/affiliate-disclosure.html' resilience.js
      - name: Validate SEO routes and crawler files
        run: |
          grep -q '/ev-guides' worker.js
          grep -q '/cars' worker.js
          grep -q '/compare/' worker.js
          grep -q '/best/' worker.js
          grep -q '/robots.txt' worker.js
          grep -q '/sitemap.xml' worker.js
          grep -q 'OAI-SearchBot' seo-guides.js
          grep -q 'FAQPage' home-seo.js
          grep -q 'tesla/model-3' seo-models.js
          grep -q 'nissan/leaf' seo-models.js
          grep -q 'bmw/i3' seo-models.js
          grep -q 'jaguar/i-pace' seo-models.js
          grep -q 'volkswagen/id-4' seo-models.js
          grep -q 'cupra/born' seo-models.js
          grep -q 'bmw/i4' seo-models.js
          grep -q 'audi/q4-e-tron' seo-models.js
          grep -q 'ford/mustang-mach-e' seo-models.js
          grep -q '/cars/bmw/i3' sitemap.xml
          grep -q '/cars/jaguar/i-pace' evscan-sitemap.xml
          grep -q '/cars/cupra/born' sitemap.xml
          grep -q '/cars/ford/mustang-mach-e' evscan-sitemap.xml
          grep -q 'hyundai-ioniq-5-vs-kia-ev6' seo-intent.js
          grep -q 'first-used-electric-car' seo-intent.js
      - name: Validate account layer
        run: |
          grep -q 'handleAccountRequest' worker-entry.js
          grep -q 'ensureAccountSchema' worker-entry.js
          grep -q 'EVSCAN_DB' worker-entry.js
          grep -q 'account-personalisation.js' worker-entry.js
          grep -q 'account-polish.js' worker-entry.js
          grep -q 'account-polish.css' worker-entry.js
          grep -q 'PBKDF2' account-api.js
          grep -q 'HttpOnly; Secure; SameSite=Lax' account-api.js
          grep -q 'saved_scans' migrations/0001_accounts.sql
          grep -q 'garage_vehicles' migrations/0001_accounts.sql
          grep -q 'Download my data' account.js
          grep -q 'Delete my account' account.js
          grep -q 'getDrivingProfile' account-personalisation.js
          grep -q 'Unlock more from EV Scan' account-polish.js
          grep -q 'Personalised EV matches' account-polish.js
          grep -q 'Ownership reminders' account-polish.js
          grep -q 'Create my free account' account-polish.js
          grep -q 'data-scroll-home' account-polish.js
      - name: Validate Find My EV v2
        run: |
          grep -q 'finder-v2.css' worker-entry.js
          grep -q 'finder-v2.js' worker-entry.js
          grep -q 'Find an EV that fits your actual life' finder-v2.js
          grep -q 'What is the most you actually want to spend' finder-v2.js
          grep -q 'public rapid charging' finder-v2.js
          grep -q 'How important is keeping insurance down' finder-v2.js
          grep -q 'Pick up to 3 things that matter most' finder-v2.js
          grep -q 'Why it fits' finder-v2.js
          grep -q 'What to watch' finder-v2.js
          grep -q '@media(max-width:680px)' finder-v2.css
      - name: Validate zero-spend provider stack
        run: |
          grep -q "getFirecrawlUsage" worker-providers.js
          grep -q "strictQualityGate" worker-providers.js
          grep -q "fail-closed" worker-providers.js
          grep -q "LISTING_CREDITS_EXHAUSTED" worker-providers.js
          grep -q "/api/listing-status" worker-providers.js
          grep -q "registrationStillAvailable" worker-providers.js
          grep -q "baseWorker.fetch(request,env,ctx)" worker-providers.js
          grep -q "FIRECRAWL_API_KEY" listing-providers.js
          grep -q "api.firecrawl.dev/v2/team/credit-usage" listing-providers.js
          grep -q "env.BROWSER.quickAction" listing-providers.js
          grep -q "cloudflare-browser" listing-providers.js
          grep -q "looksLikeRegistration" listing-live.js
          grep -q "Let live.js handle registration-only checks" listing-live.js
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '"binding": "BROWSER"' wrangler.jsonc
          ! grep -q "MARKETCHECK_API_KEY" listing-providers.js
          ! grep -q "api.marketcheck.com" listing-providers.js
          ! grep -q "JINA_API_KEY" listing-providers.js
          ! grep -q "r.jina.ai" listing-providers.js
          ! grep -q "REEF_API_KEY" listing-providers.js
      - name: Validate fail-closed report promises
        run: |
          grep -q "deal:null" worker-providers.js
          grep -q "marketPricing:false" worker-providers.js
          grep -q "Battery State of Health" worker-providers.js
          grep -q "quality?.passed !== true" listing-live.js
          grep -q "Market comparison</span><strong>Not claimed" listing-live.js
          grep -q "No report was generated" listing-providers.js
      - name: Validate Wrangler JSONC basics
        run: |
          grep -q '"main": "./worker-entry.js"' wrangler.jsonc
          grep -q '"d1_databases"' wrangler.jsonc
          grep -q '"binding": "EVSCAN_DB"' wrangler.jsonc
          grep -q '"database_name": "ec-scan-db"' wrangler.jsonc
          grep -q '"database_id": "2f90d7be-db18-47eb-983e-3ce9095921e9"' wrangler.jsonc
          grep -q '"/api/\*"' wrangler.jsonc
          grep -q '"/cars/\*"' wrangler.jsonc
          grep -q '"/compare/\*"' wrangler.jsonc
          grep -q '"/best/\*"' wrangler.jsonc

