name: Validate EV Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check live.js
          node --check worker.js
          node --check autotrader.js
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f live.js
          test -f worker.js
          test -f autotrader.js
          test -f wrangler.jsonc
          test -f .assetsignore
      - name: Validate Wrangler JSONC basics
        run: |
          grep -q '"main": "./worker.js"' wrangler.jsonc
          grep -q '"/api/\*"' wrangler.jsonc
