name: Validate Wrangler Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wrangler-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker bundle and Wrangler bindings
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir .wrangler-audit
